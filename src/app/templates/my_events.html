{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div id="my-events-page" class="my-events-page"
     data-events-url="{{ url_for('my_events.get_my_events') }}"
     data-participations-url="{{ url_for('my_events.get_my_participating_events') }}">
<section class="my-events-section" aria-labelledby="participationsTitle">
    <h2 id="participationsTitle" class="my-events-section-title">
        <i class="fas fa-users" aria-hidden="true"></i>
        <span>Я участвую</span>
    </h2>
    <div id="participationsContainer" class="events-container"></div>
</section>
<section class="my-events-section" aria-labelledby="createdEventsTitle">
    <h2 id="createdEventsTitle" class="my-events-section-title">
        <i class="fas fa-calendar-plus" aria-hidden="true"></i>
        <span>Я организую</span>
    </h2>
    <div id="createdEventsContainer" class="events-container"></div>
</section>
<div class="create-hero">
    <button class="new-event-btn" aria-label="Создать мероприятие">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M11 17C11 17.5523 11.4477 18 12 18C12.5523 18 13 17.5523 13 17V13H17C17.5523 13 18 12.5523 18 12C18 11.4477 17.5523 11 17 11H13V7C13 6.44771 12.5523 6 12 6C11.4477 6 11 6.44771 11 7V11H7C6.44772 11 6 11.4477 6 12C6 12.5523 6.44772 13 7 13H11V17Z" fill="currentColor"></path>
        </svg>
    </button>
</div>
<div class="form-overlay" id="form-overlay" aria-hidden="true">
<form class="create-form" id="event-form" method="POST" action="{{ url_for('events.create_event') }}">
    <button class="close-btn" id="close-form" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6L18 18M18 6L6 18"></path>
        </svg>
    </button>
    <h1>Создание мероприятия</h1>

    <label>Категория
        <select name="category">
            {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Место
        <input type="text" name="location" required>
    </label>

    <label>Название
        <input type="text" name="title" required>
    </label>

    <div class="compact-row">
        <label>Дата
            <input type="date" name="date" id="event-date" required min="{{ today }}">
        </label>
        <label>Время
            <input type="time" name="time" id="event-time" required>
        </label>
        <label>Кол-во чел.
            <div class="input-with-icon">
                <input type="number" name="participants" placeholder="" min="2" max="{{ max_event_participants }}" required>
            </div>
        </label>
    </div>

    <label class="duration-field">Продолжительность
        <span class="duration-input">
            <input type="number" name="duration_hours" min="0" max="24" step="1" value="1" aria-label="Часы" required>
            <span class="duration-unit duration-hours-unit">ч</span>
            <input type="number" name="duration_minutes" min="0" max="59" step="1" value="0" aria-label="Минуты" required>
            <span class="duration-unit">мин</span>
        </span>
    </label>
    <div class="required-note">от 15 минут до 24 часов</div>

    <label>Описание
        <textarea name="description" required></textarea>
    </label>
    <div class="required-note">все поля обязательны для заполнения</div>

    <button class="btn s-btn" type="submit">СОЗДАТЬ</button>
</form>
</div>

<div class="categories-modal" id="eventDetailModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="eventDetailTitle">
    <div class="modal-overlay" id="eventDetailOverlay" tabindex="-1"></div>
    <div class="modal-content">
        <button class="modal-close" id="eventDetailClose" type="button" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M6 6L18 18M18 6L6 18"></path>
            </svg>
        </button>
        <div id="eventDetailBody"></div>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<link href="{{ url_for('static', filename='css/my-events.css') }}" rel="stylesheet">
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/my-events-page.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/event-form.js') }}"></script>
{% endblock %}
